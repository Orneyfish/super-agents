name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.1"   # the same as build-core.yml, so fmt and clippy cannot start failing on a toolchain bump nobody chose

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck -x -S warning bin/super-agents scripts/*.sh tests/run.sh .githooks/pre-push
      - name: Rust checks
        working-directory: core
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          cargo "+$RUST_TOOLCHAIN" fmt --check
          cargo "+$RUST_TOOLCHAIN" clippy --locked --all-targets -- -D warnings
          cargo "+$RUST_TOOLCHAIN" test --locked
      - name: Tests
        run: bash tests/run.sh

  core-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust tests
        working-directory: core
        run: cargo test --locked

  # The plugin's shell side under Git Bash, which is what Claude Code uses on Windows: the launcher, the hooks and tests/run.sh.
  shell-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The published sa-core.exe installs through the launcher (once this version is released)
        run: |
          ver=$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' .claude-plugin/plugin.json | head -1)
          if curl -fsIL "https://github.com/Orneyfish/super-agents/releases/download/v$ver/checksums.txt" >/dev/null; then
            bin/super-agents install-core
          else
            echo "v$ver is not published yet, so there is no binary to download; skipped"
          fi
      - name: Tests
        run: bash tests/run.sh
